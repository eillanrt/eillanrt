    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rssUrl = 'https://blog.eillanrt.com/index.xml';
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            const blogPostUl = document.querySelector('.blog-posts-ul');

            fetch(apiUrl).then(res => {
                if (res.ok) return res.json();

                throw new Error('Response from apiUrl is not ok');
                }).then(data => {
                    if (data.status === 'ok') {
                        const posts = data.items.slice(0, 6);

                        posts.forEach(post => {
                            let cleanDescription;

                            if (post.description.length > 150) cleanDescription = post.description.substring(0, 150);
                            else cleanDescription = post.description;

                            const li = document.createElement('li');
                            li.classList.add('thought-item');
                            li.innerHTML = `
                            <a href="${post.link}"><h1>${post.title}</h1></a>
                            <p>${cleanDescription}</p>
                            `

                            blogPostUl.appendChild(li);
                        });
                    }
                });
            });

        
    </script>
